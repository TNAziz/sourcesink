# Build installers for Linux, Windows and macOS when a version tag is pushed
# (e.g. `git tag v0.2.0 && git push origin v0.2.0`), and attach them to a
# GitHub Release. The macOS build is unsigned: first launch needs
# right-click → Open (see README).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm
      - name: Build installers
        run: npm run dist -w @sourcesink/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            src/desktop/release/*.AppImage
            src/desktop/release/*.deb
            src/desktop/release/*.pacman
            src/desktop/release/*.tar.gz
            src/desktop/release/*.exe
            src/desktop/release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/*
            docs/manual/sourcesink-manual.pdf
          generate_release_notes: true
